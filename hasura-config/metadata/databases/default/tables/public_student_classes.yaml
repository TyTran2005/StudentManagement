table:
  name: student_classes
  schema: public
object_relationships:
  - name: class
    using:
      foreign_key_constraint_on: class_id
  - name: user
    using:
      foreign_key_constraint_on: student_id
select_permissions:
  - role: student
    permission:
      columns:
        - class_id
        - enrolled_at
        - student_id
      filter:
        student_id:
          _eq: X-Hasura-User-Id
      limit: 20
    comment: ""